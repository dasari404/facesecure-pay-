<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FaceSecure Pay</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <!-- Register Page -->
    <div id="register-page" class="page active">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo-icon">🔐</div>
                    <h1>Create Account</h1>
                    <p>Join FaceSecure Pay today</p>
                </div>

                <form id="register-form" class="auth-form">
                    <div class="alert alert-error" id="register-error" style="display: none;"></div>
                    <div class="alert alert-success" id="register-success" style="display: none;"></div>

                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input 
                            type="text" 
                            id="full-name" 
                            name="full_name"
                            placeholder="Enter your full name"
                            required
                            minlength="2"
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number (Optional)</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="Create a password (min. 8 characters)"
                            required
                            minlength="8"
                            autocomplete="new-password"
                        >
                        <span class="form-hint">Must be at least 8 characters long</span>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required
                            minlength="8"
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" required>
                            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="register-btn">
                        Create Account
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Client-side validation
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        
        confirmPasswordInput.addEventListener('input', function() {
            if (this.value !== passwordInput.value) {
                this.setCustomValidity('Passwords do not match');
            } else {
                this.setCustomValidity('');
            }
        });
        
        // Register form handler
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('full-name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorDiv = document.getElementById('register-error');
            const registerBtn = document.getElementById('register-btn');
            
            // Hide alerts
            errorDiv.style.display = 'none';
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'flex';
                return;
            }
            
            // Validate email format
            if (!isValidEmail(email)) {
                errorDiv.textContent = 'Please enter a valid email address';
                errorDiv.style.display = 'flex';
                return;
            }
            
            // Validate phone if provided
            if (phone && !isValidPhone(phone)) {
                errorDiv.textContent = 'Please enter a valid phone number';
                errorDiv.style.display = 'flex';
                return;
            }
            
            // Show loading
            setLoadingState(registerBtn, true);
            
            try {
                await register(email, password, fullName, phone);
            } catch (error) {
                // Show error
                errorDiv.textContent = error.message || 'Registration failed. Please try again.';
                errorDiv.style.display = 'flex';
            } finally {
                // Reset button
                setLoadingState(registerBtn, false);
            }
        });
    </script>
</body>
</html>
